[project]
name = "alpha-centure"
version = "0.1.0"
description = "Binance market data pipeline + regime-aware prediction (step 1: data)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30",
    "httpx>=0.27",
    "websockets>=14.0",
    "pydantic-settings>=2.4",
    "loguru>=0.7",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "streamlit>=1.40",
    "plotly>=5.24",
    "hmmlearn>=0.3.3",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.1",
    "pyarrow>=25.0.1",
    "xgboost>=3.4.1",
    "catboost>=1.2.10",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning:hmmlearn.*", "ignore::FutureWarning:hmmlearn.*"]
